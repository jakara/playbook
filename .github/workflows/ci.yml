name: Check, build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this version after checks and build (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: playbook-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Ensure Google Chrome is available
        run: |
          if [ ! -d '/Applications/Google Chrome.app' ]; then
            npx playwright install chrome
          fi
      - run: npm run check
      - run: npm run package:mac
      - name: Stage and checksum distribution
        run: node scripts/stage-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ github.sha }}
          path: distribution/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish complete release, then retire older patches
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: playbook-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-${{ github.sha }}
          path: distribution
          digest-mismatch: error
      - name: Publish verified assets and keep one patch per series
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs
